<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalScope</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#090c10; color:#e8edf2; }
  header { padding:15px 16px; background:#0f151c; border-bottom:1px solid #26313d; position:sticky; top:0; z-index:2; }
  h1 { font-size:19px; margin:0; letter-spacing:.2px; }
  main { padding:12px; max-width:980px; margin:auto; }
  .panel { background:#121922; border:1px solid #273442; border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 12px 28px rgba(0,0,0,.22); }
  .grid { display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width:760px){ .grid { grid-template-columns:1fr 1fr; } }
  label { display:block; margin:9px 0 5px; color:#cdd6df; font-size:13px; }
  select, input[type=range], button, input[type=number] { width:100%; box-sizing:border-box; }
  select, button, input[type=number] { padding:10px 11px; border-radius:12px; border:1px solid #344456; background:#0c1118; color:#f2f5f7; }
  button { margin-top:10px; font-weight:650; }
  button + button { margin-top:8px; }
  .row { display:grid; grid-template-columns:1fr 78px; gap:10px; align-items:center; }
  .value { color:#aeb8c4; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
  canvas { width:100%; height:225px; background:#030609; border:1px solid #26313d; border-radius:12px; margin-top:9px; }
  #waterfall { height:310px; }
  .readout { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .chip { background:#0c1118; border:1px solid #26313d; border-radius:12px; padding:9px 10px; font-size:13px; color:#cfd7df; }
  .chip b { display:block; color:#f2f5f7; font-size:14px; margin-bottom:2px; }
  .hint { color:#9ca8b5; font-size:13px; line-height:1.35; margin-bottom:0; }
</style>
</head>
<body>
<header><h1>SignalScope</h1></header>
<main>
  <section class="panel">
    <div class="grid">
      <div>
        <label>Modulation</label>
        <select id="mod">
          <option value="carrier">Carrier</option>
          <option value="am">AM</option>
          <option value="fm">FM</option>
          <option value="ook">OOK / ASK</option>
          <option value="fsk">2-FSK</option>
          <option value="bpsk">BPSK</option>
          <option value="qpsk">QPSK</option>
          <option value="lora">LoRa-like chirp</option>
        </select>

        <label>Center frequency</label>
        <div class="row"><input id="center" type="range" min="10" max="2500" value="915"><div class="value" id="centerv"></div></div>

        <label>Spectrum span</label>
        <div class="row"><input id="span" type="range" min="25" max="5000" value="500"><div class="value" id="spanv"></div></div>

        <label>Symbol rate / baud</label>
        <div class="row"><input id="sr" type="range" min="1" max="200" value="50"><div class="value" id="srv"></div></div>
      </div>

      <div>
        <label>Bandwidth</label>
        <div class="row"><input id="bw" type="range" min="1" max="5000" value="125"><div class="value" id="bwv"></div></div>

        <label>RBW</label>
        <div class="row"><input id="rbw" type="range" min="1" max="50" value="8"><div class="value" id="rbwv"></div></div>

        <label>VBW / smoothing</label>
        <div class="row"><input id="vbw" type="range" min="0" max="95" value="35"><div class="value" id="vbwv"></div></div>

        <label>Noise floor</label>
        <div class="row"><input id="noise" type="range" min="-120" max="-40" value="-95"><div class="value" id="noisev"></div></div>
      </div>
    </div>

    <button id="random">Random symbols</button>
    <button id="play">Play waterfall</button>
    <button id="clearwf">Clear waterfall</button>

    <div class="readout">
      <div class="chip"><b id="freqRange">---</b>displayed range</div>
      <div class="chip"><b id="occupied">---</b>approx. occupied bandwidth</div>
    </div>
  </section>

  <section class="panel">
    <b>Waveform</b>
    <canvas id="time" width="980" height="260"></canvas>
  </section>

  <section class="panel">
    <b>Spectrum</b>
    <canvas id="fft" width="980" height="260"></canvas>
  </section>

  <section class="panel">
    <b>Waterfall</b>
    <canvas id="waterfall" width="980" height="340"></canvas>
  </section>

  <section class="panel">
    <b>Constellation</b>
    <canvas id="iq" width="980" height="260"></canvas>
    <p class="hint">Constellation is meaningful for PSK/QAM-style signals. For FM, FSK, AM, and chirps it is only a rough baseband view.</p>
  </section>
</main>

<script>
const N = 768;
let symbols = Array.from({length:512}, () => Math.floor(Math.random()*4));
let playing = false;
let rafId = null;
let frame = 0;
let spectrumAvg = null;

const $ = id => document.getElementById(id);
function val(id){ return Number($(id).value); }
function randn(){ return (Math.random()*2-1) + (Math.random()*2-1) + (Math.random()*2-1); }
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }

function fmtFreq(mhz){
  if(mhz >= 1000) return (mhz/1000).toFixed(3) + " GHz";
  return mhz.toFixed(3) + " MHz";
}
function fmtK(x){ return x >= 1000 ? (x/1000).toFixed(2)+" MHz" : Math.round(x)+" kHz"; }

function settings(){
  return {
    mod: $("mod").value,
    center: val("center"),
    span: val("span"),
    sr: val("sr"),
    bw: val("bw"),
    rbw: val("rbw"),
    vbw: val("vbw")/100,
    noiseDb: val("noise")
  };
}

function generate(frameShift = 0){
  const s = settings();
  let y=[], I=[], Q=[];
  let phase = 0;
  const carrierCycles = 0.18;              // visual offset inside the simulated display
  const baudNorm = s.sr / 1500;            // normalized message rate
  const bwRatio = clamp(s.bw / Math.max(1, s.span), 0.001, 1);
  const bwNorm = 0.002 + bwRatio * 0.08;
  const devNorm = 0.001 + bwRatio * 0.045;
  const noiseAmp = Math.pow(10, (s.noiseDb + 120) / 40) * 0.18;

  for(let n=0;n<N;n++){
    const t = n / N;
    const symPos = t * Math.max(2, s.sr / 5);
    const si = (Math.floor(symPos) + frameShift) % symbols.length;
    const frac = symPos - Math.floor(symPos);
    const a = symbols[si] & 1;
    const b = (symbols[si] >> 1) & 1;
    const na = symbols[(si + 1) % symbols.length] & 1;

    const edge = Math.max(0.015, 0.45 - s.bw * 0.38);
    const mix = frac > (1-edge) ? (frac - (1-edge)) / edge : 0;
    const bitVal = a * (1-mix) + na * mix;
    const bitHard = bitVal > 0.5 ? 1 : 0;

    let amp = 1;
    let freq = carrierCycles;
    let phOffset = 0;

    const msg = Math.sin(2*Math.PI*(1 + s.sr/40)*t + frameShift*0.08);

    if(s.mod === "carrier"){
      freq = carrierCycles;
    } else if(s.mod === "am"){
      amp = 0.45 + (0.25 + bwRatio*0.65) * (0.5 + 0.5*msg);
    } else if(s.mod === "fm"){
      freq = carrierCycles + msg * devNorm * 0.35;
    } else if(s.mod === "ook"){
      amp = 0.08 + 0.92 * bitVal;
    } else if(s.mod === "fsk"){
      freq = carrierCycles + ((bitVal*2-1) * devNorm * 0.7);
    } else if(s.mod === "bpsk"){
      phOffset = bitHard ? 0 : Math.PI;
    } else if(s.mod === "qpsk"){
      phOffset = (a*2 + b) * Math.PI/2 + Math.PI/4;
    } else if(s.mod === "lora"){
      const sweep = ((frac + (frameShift % 60)/60) % 1) - 0.5;
      freq = carrierCycles + sweep * (0.008 + bwRatio*0.22);
    }

    // Extra symbol-rate edge content. This helps fast digital signals widen naturally.
    if(["ook","bpsk","qpsk"].includes(s.mod)) {
      freq += (bitVal - 0.5) * bwNorm * 0.12;
    }

    phase += 2*Math.PI*freq;
    phase %= 2*Math.PI;

    const sample = amp * Math.sin(phase + phOffset) + noiseAmp*randn();
    y.push(sample);

    if(s.mod === "bpsk"){
      I.push((bitHard ? 1 : -1) + noiseAmp*randn()); Q.push(noiseAmp*randn());
    } else if(s.mod === "qpsk"){
      I.push((a ? 1 : -1) + noiseAmp*randn()); Q.push((b ? 1 : -1) + noiseAmp*randn());
    } else if(s.mod === "fsk"){
      I.push(bitHard ? 0.75 : -0.75); Q.push(noiseAmp*randn());
    } else if(s.mod === "ook" || s.mod === "am"){
      I.push(amp + noiseAmp*randn()); Q.push(noiseAmp*randn());
    } else if(s.mod === "lora"){
      I.push(Math.cos(phase) * (0.5+frac)); Q.push(Math.sin(phase) * (0.5+frac));
    } else {
      I.push(Math.cos(phase) + noiseAmp*randn()); Q.push(Math.sin(phase) + noiseAmp*randn());
    }
  }
  return {y,I,Q};
}

function drawAxes(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#26313d"; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(42,h/2); ctx.lineTo(w-12,h/2);
  ctx.moveTo(42,12); ctx.lineTo(42,h-24);
  ctx.stroke();
}

function drawTime(y){
  const c=$("time"), ctx=c.getContext("2d"), w=c.width, h=c.height;
  drawAxes(ctx,w,h);
  ctx.strokeStyle="#e6edf3"; ctx.lineWidth=2; ctx.beginPath();
  for(let i=0;i<y.length;i++){
    const x=42+i*(w-58)/(y.length-1);
    const yy=h/2-y[i]*(h*0.33);
    if(i===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
  }
  ctx.stroke();
}

function dftMag(y){
  let mags=[];
  for(let k=0;k<N/2;k++){
    let re=0, im=0;
    for(let n=0;n<N;n++){
      const win = 0.5 - 0.5*Math.cos(2*Math.PI*n/(N-1));
      const sample = y[n] * win;
      const a=2*Math.PI*k*n/N;
      re += sample*Math.cos(a);
      im -= sample*Math.sin(a);
    }
    mags.push(Math.sqrt(re*re+im*im));
  }

  // RBW approximation: bin averaging.
  const rbw = settings().rbw;
  let smooth = mags.slice();
  const radius = Math.max(0, Math.floor(rbw/4));
  if(radius > 0){
    smooth = mags.map((_,i)=>{
      let sum=0, count=0;
      for(let j=i-radius;j<=i+radius;j++){
        if(j>=0 && j<mags.length){ sum += mags[j]; count++; }
      }
      return sum/count;
    });
  }

  const max=Math.max(...smooth)||1;
  let norm = smooth.map(v=>Math.pow(v/max, 0.48));

  // VBW approximation: temporal smoothing.
  const vbw = settings().vbw;
  if(spectrumAvg && spectrumAvg.length === norm.length){
    norm = norm.map((v,i)=>spectrumAvg[i]*vbw + v*(1-vbw));
  }
  spectrumAvg = norm.slice();
  return norm;
}

function drawLabels(ctx,w,h){
  const s=settings();
  const left=s.center-s.span/2000;
  const right=s.center+s.span/2000;
  ctx.fillStyle="#9ca8b5";
  ctx.font="12px system-ui";
  ctx.fillText(fmtFreq(left), 46, h-8);
  ctx.fillText(fmtFreq(s.center), w/2-38, h-8);
  ctx.fillText(fmtFreq(right), w-118, h-8);
}

function drawFFT(y){
  const c=$("fft"), ctx=c.getContext("2d"), w=c.width, h=c.height;
  drawAxes(ctx,w,h);
  const mags=dftMag(y);
  ctx.strokeStyle="#e6edf3"; ctx.lineWidth=2; ctx.beginPath();
  for(let i=1;i<mags.length;i++){
    const x=42+i*(w-58)/(mags.length-1);
    const yy=h-28-mags[i]*(h-52);
    if(i===1) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
  }
  ctx.stroke();
  drawLabels(ctx,w,h);
}

function color(v){
  v=clamp(v,0,1);
  const r = Math.floor(20 + v*235);
  const g = Math.floor(35 + Math.pow(v,0.7)*190);
  const b = Math.floor(45 + Math.pow(v,1.7)*90);
  return `rgb(${r},${g},${b})`;
}

function drawWaterfall(y){
  const c=$("waterfall"), ctx=c.getContext("2d"), w=c.width, h=c.height;
  const rowH=2;
  const old=ctx.getImageData(0,0,w,h-rowH);
  ctx.putImageData(old,0,rowH);
  ctx.fillStyle="#030609"; ctx.fillRect(0,0,w,rowH);
  const mags=dftMag(y);
  for(let i=1;i<mags.length;i++){
    const x=42+i*(w-58)/(mags.length-1);
    ctx.fillStyle=color(mags[i]);
    ctx.fillRect(x,0,Math.max(1,(w-58)/mags.length),rowH);
  }
  ctx.fillStyle="rgba(3,6,9,.78)";
  ctx.fillRect(0,h-22,w,22);
  drawLabels(ctx,w,h);
}

function drawIQ(I,Q){
  const c=$("iq"), ctx=c.getContext("2d"), w=c.width, h=c.height;
  drawAxes(ctx,w,h);
  ctx.strokeStyle="#26313d";
  ctx.beginPath(); ctx.moveTo(w/2,12); ctx.lineTo(w/2,h-24); ctx.stroke();
  ctx.fillStyle="#e6edf3";
  for(let i=0;i<I.length;i+=5){
    const x=w/2 + I[i]*(w*0.2);
    const y=h/2 - Q[i]*(h*0.32);
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
  }
}

function approxOBW(){
  const s=settings();
  let khz;
  if(s.mod === "carrier") khz = Math.max(1, s.rbw*0.5);
  else if(s.mod === "am") khz = Math.max(s.bw, 2 * (s.sr/4));
  else if(s.mod === "fm") khz = Math.max(s.bw, 2 * ((s.bw/6) + (s.sr/8)));
  else if(s.mod === "fsk") khz = Math.max(s.bw, 2 * ((s.bw/5) + s.sr/2));
  else if(s.mod === "lora") khz = s.bw;
  else khz = Math.max(s.bw, s.sr * 1.2);
  return fmtK(khz);
}

function updateLabels(){
  const s=settings();
  $("centerv").textContent = fmtFreq(s.center);
  $("spanv").textContent = fmtK(s.span);
  $("srv").textContent = Math.round(s.sr) + " Bd";
  $("bwv").textContent = fmtK(s.bw);
  $("rbwv").textContent = s.rbw;
  $("vbwv").textContent = Math.round(s.vbw*100) + "%";
  $("noisev").textContent = s.noiseDb + " dB";

  const left=s.center-s.span/2000;
  const right=s.center+s.span/2000;
  $("freqRange").textContent = fmtFreq(left) + " – " + fmtFreq(right);
  $("occupied").textContent = approxOBW();
}

function clearWaterfall(){
  const c=$("waterfall"), ctx=c.getContext("2d");
  ctx.fillStyle="#030609";
  ctx.fillRect(0,0,c.width,c.height);
}

function render(){
  updateLabels();
  const s=generate(frame);
  drawTime(s.y); drawFFT(s.y); drawWaterfall(s.y); drawIQ(s.I,s.Q);
}

function playLoop(){
  if(!playing) return;
  frame++;
  if(frame % 3 === 0) render();
  rafId=requestAnimationFrame(playLoop);
}
function setPlaying(state){
  playing=state;
  $("play").textContent=playing ? "Pause waterfall" : "Play waterfall";
  if(playing){ if(rafId) cancelAnimationFrame(rafId); rafId=requestAnimationFrame(playLoop); }
  else if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

["mod","center","span","sr","bw","rbw","vbw","noise"].forEach(id => $(id).addEventListener("input", () => { spectrumAvg=null; render(); }));
$("random").addEventListener("click", () => { symbols=Array.from({length:512}, () => Math.floor(Math.random()*4)); spectrumAvg=null; render(); });
$("play").addEventListener("click", () => setPlaying(!playing));
$("clearwf").addEventListener("click", () => { clearWaterfall(); spectrumAvg=null; render(); });

clearWaterfall();
render();
</script>
</body>
</html>
